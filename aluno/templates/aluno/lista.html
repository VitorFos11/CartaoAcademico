<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cartão de Identidade Acadêmica</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            padding: 30px;
            transition: 0.3s;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
        }

        .botao {
            display: block;
            margin: 0 auto 40px;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background-color: #ffffff;
            color: #121212;
            font-size: 16px;
            font-weight: bold;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .card {
            background: #1e1e1e;
            width: 450px;
            min-height: 200px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: aparecer 0.6s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0px 15px 30px rgba(255,255,255,0.15);
        }

        .card h2 {
            margin-top: 0;
            color: #00bfff;
            font-size: 28px;
        }

        .curso {
            font-weight: bold;
            font-size: 18px;
            color: #ddd;
        }

        .bio {
            font-size: 16px;
            line-height: 1.6;
            color: #bbb;
        }


        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* Tema claro */

        .claro {
            background-color: #f2f2f2;
            color: #121212;
        }

        .claro .card {
            background: white;
            color: #121212;
        }

        .claro .bio {
            color: #444;
        }

        .claro .curso {
            color: #222;
        }

    </style>

</head>


<body>


<h1>🎓 Cartão de Identidade Acadêmica</h1>


<button class="botao" onclick="tema()">
    Alternar Tema 🌙
</button>


<div class="container">


{% for aluno in alunos %}


<div class="card">

    <h2>{{ aluno.nome }}</h2>

    <p class="curso">
        📚 Curso: {{ aluno.curso }}
    </p>

    <p class="bio">
        {{ aluno.bio }}
    </p>

</div>


{% endfor %}


</div>


<script>

function tema(){

    document.body.classList.toggle("claro");

}

</script>


</body>
</html>
